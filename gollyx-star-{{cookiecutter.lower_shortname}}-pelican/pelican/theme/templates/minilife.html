<!-- minilife include template -->
<div class="row justify-content-lg-center">
  <div class="col-md-4">
    <div>
      <h3 class="minilife-title">minilife</h3>
    </div>
    <div>
      <button type="button" id="buttonRun"   class="btn btn-sm btn-success">Run</button>
      <button type="button" id="buttonStep"  class="btn btn-sm btn-ghost">Step</button>
      <button type="button" id="buttonClear" class="btn btn-sm btn-ghost">Clear</button>
    </div>
    <div class="minilife-stats">
      <span>Generation <b id="generation"></b></span>
      <span>Live cells <b id="livecells"></b></span>
    </div>
  </div>
</div>

<div class="row justify-content-lg-center">
  <div class="col-md-4">
    <noscript>You must enable Javascript to play minilife.</noscript>
    <canvas id="canvas" width="400" height="400"></canvas>
  </div>
</div>
